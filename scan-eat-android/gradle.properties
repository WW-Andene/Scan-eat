# 4 GB: the release build's R8 step ran the 2 GB daemon out of memory on CI
# ("Could not receive a message from the daemon"); CI runners have 16 GB.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g

# AndroidX packages required — Compose, Room, Hilt, Navigation etc. are all AndroidX.
android.useAndroidX=true

# Each module gets its own R class instead of one shared, transitive namespace.
android.nonTransitiveRClass=true

kotlin.code.style=official
